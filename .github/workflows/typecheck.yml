name: Typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Redesign FUN sports map"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "Redesign FUN sports map/package-lock.json"
      - run: npm ci
      # Type-checks the client (tsconfig.json) AND server/edge code (tsconfig.node.json).
      - run: npm run typecheck

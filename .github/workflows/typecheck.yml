name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Redesign FUN sports map"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node as local development (.nvmrc at the repo root).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "Redesign FUN sports map/package-lock.json"
      - run: npm ci
      # Type-checks the client (tsconfig.json) AND server/edge code (tsconfig.node.json).
      - run: npm run typecheck
      # Vitest unit suite (pure logic + API error classification).
      - run: npm test
      # vercel.json against Vercel's own schema. The build never reads that file, and a
      # deploy Vercel rejects keeps the previous one serving (see bd73cd9).
      - run: npm run check:vercel
      # The production bundle: typechecking clean does not mean Vite can build it.
      - run: npm run build
